<script id="game-code">
'use strict';
// Reading is untimed. Only a deliberate cone click can start a jump.
const TIMING=Object.freeze({crouch:280,flight:1100,land:350,camera:1500,restarting:1900});
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
class Journey {
 constructor(stops){this.stops=stops;this.reset();}
 reset(){this.current=0;this.phase='ready';this.elapsed=0;this.camera=0;this.word=-1;this.cardAge=0;this.landingAge=Infinity;this.clock=0;this.restartFrom=0;}
 click(){if(this.phase!=='ready'||this.current>=this.stops.length-1)return false;
  // Every click, including the first, shows one picture and starts one jump.
  this.word=this.current;this.cardAge=0;this.phase='crouch';this.elapsed=0;return true;
 }
 restart(){if(this.phase!=='finished')return false;this.restartFrom=this.camera;this.phase='restarting';this.elapsed=0;this.current=0;this.word=-1;this.landingAge=Infinity;return true;}
 step(dt){if(!Number.isFinite(dt)||dt<0)return;this.clock+=dt;this.cardAge+=dt;this.landingAge+=dt;let left=dt;
  while(left>0){const duration=TIMING[this.phase];if(!duration)break;const used=Math.min(left,duration-this.elapsed);this.elapsed+=used;left-=used;
   if(this.phase==='camera'){const a=this.stops[this.current-1].cameraBottom,b=this.stops[this.current].cameraBottom;this.camera=a+(b-a)*smooth(this.elapsed/duration);}
   if(this.phase==='restarting')this.camera=this.restartFrom*(1-smooth(this.elapsed/duration));
   if(this.elapsed<duration)break;
   const phase=this.phase;this.elapsed=0;
   if(phase==='crouch')this.phase='flight';
   else if(phase==='flight'){this.current++;this.landingAge=0;this.phase='land';}
   else if(phase==='land')this.phase='camera';
   else if(phase==='camera')this.phase=this.current===this.stops.length-1?'finished':'ready';
   else if(phase==='restarting'){this.reset();break;}
  }
 }
}
// Runtime uses the same manifest as the approved asset pack, embedded here.
const M=JSON.parse(document.getElementById('manifest-data').textContent);
const J=new Journey(M.stops),images={},c=document.getElementById('scene').getContext('2d');
const cone=document.getElementById('cone'),finish=document.getElementById('finish'),again=document.getElementById('again'),errorBox=document.getElementById('error');
const menu=document.getElementById('menu'),backMenu=document.getElementById('back-menu'),roundButtons=[...document.querySelectorAll('[data-round]')];
let inMenu=true,selectedRound='start';
function roundStops(count){
 const start=M.stops[0].height,top=M.stops[M.stops.length-1].height;
 return M.stops.slice(0,count+1).map((stop,i)=>{
  const height=start+(top-start)*i/count,shift=height-stop.height;
  return {...stop,height,rootHeight:stop.rootHeight+shift,cameraBottom:stop.cameraBottom+shift};
 });
}
function chooseRound(id){if(!loaded||!M.rounds[id])return;selectedRound=id;M.tasks=M.rounds[id].tasks;J.stops=roundStops(M.tasks.length);J.reset();lastWord=-1;lastPhase='';last=0;inMenu=false;menu.hidden=true;syncUI();cone.focus({preventScroll:true});}
function showMenu(){inMenu=true;J.reset();lastWord=-1;lastPhase='';last=0;document.getElementById('announcement').textContent='';menu.hidden=false;syncUI();roundButtons.find(b=>b.dataset.round===selectedRound).focus({preventScroll:true});}
roundButtons.forEach(b=>b.addEventListener('click',()=>chooseRound(b.dataset.round)));
backMenu.addEventListener('click',showMenu);document.getElementById('finish-menu').addEventListener('click',showMenu);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let loaded=false,last=0,lastPhase='',lastWord=-1,loadAttempt=0,keyboardInteraction=false,nearLayer=null;
const BASE=new URL('.',document.baseURI);
function sprite(group,name,x,y,mirror=false,breath=0,alpha=1){const g=M.squirrel[group],f=g.frames[name],s=f.worldScale;c.save();c.globalAlpha*=alpha;c.translate(x,y);c.scale(mirror?-1:1,1+breath);c.drawImage(images[g.file],...f.source,-f.anchor[0]*s,-f.anchor[1]*s,f.source[2]*s,f.source[3]*s);c.restore();}
function idleFrame(){const t=J.clock%5400;return t>3500&&t<3640?'blink':t<1800?'rest':t<3200?'breathe-in':'breathe-out';}
function waveFrame(){return ['front','raise','out','in','out','in','front'][Math.floor(J.clock/380)%7];}
function branchAngle(stop){if(stop.id!==J.current||J.landingAge>950||reduced)return 0;const t=J.landingAge/1000;return (stop.landingX<stop.rootX?-1:1)*.045*Math.exp(-4*t)*Math.sin(t*15);}
function conePoint(){const stop=J.stops[J.current+1];return stop?{x:stop.landingX,y:900-stop.height+J.camera-49}:null;}
function paintCone(x,y){const scale=J.phase==='ready'&&!reduced?1+.025*Math.sin(J.clock/380):1;c.save();c.translate(x,y);c.scale(scale,scale);c.drawImage(images['assets/ui/cone.png'],320,100,680,1060,-34,-54,68,106);c.restore();}
function perched(stop,dx,dy){const mirrored=J.phase==='crouch'?J.stops[J.current+1].landingX>stop.landingX:stop.id%2===1;
 if(J.phase==='crouch'){sprite('jump','crouch',dx,dy,mirrored);return;}
 if(J.phase==='land'||(J.phase==='camera'&&J.landingAge<850)){
  const stand=smooth((J.landingAge-550)/300);sprite('jump','land',dx,dy,stop.id%2===0,0,1-stand);
  if(stand>0){if(stop.id===J.stops.length-1)sprite('wave','front',dx,dy,false,0,stand);else sprite('idle','rest',dx,dy,stop.id%2===1,0,stand);}return;
 }
 if(stop.id===J.stops.length-1&&(J.phase==='camera'||J.phase==='finished')){sprite('wave',waveFrame(),dx,dy);return;}
 const breath=reduced?0:Math.sin(J.clock/850)*.007;
 sprite('idle',idleFrame(),dx,dy,mirrored,breath);
}
function paintStop(stop){const v=M.branchVariants[stop.branch],s=stop.branchScale,ry=900-stop.rootHeight+J.camera;if(ry < -450||ry>1250)return;
 const dx=(v.landing[0]-v.pivot[0])*s,dy=(v.landing[1]-v.pivot[1])*s;
 c.save();c.translate(stop.rootX,ry);c.rotate(branchAngle(stop));
 c.drawImage(images[v.file],...v.source,-v.pivot[0]*s,-v.pivot[1]*s,v.source[2]*s,v.source[3]*s);
 if(stop.id===J.current+1&&J.phase!=='restarting')paintCone(dx,dy-49);
 if(stop.id===J.current&&J.phase!=='flight'){perched(stop,dx,dy);c.drawImage(images['assets/branches/needles-front.png'],dx-53,dy-5,106,53);}
 c.restore();
}
function paintFlight(){const from=J.stops[J.current],to=J.stops[J.current+1],u=Math.min(1,J.elapsed/TIMING.flight),x=from.landingX+(to.landingX-from.landingX)*u,y=900-from.height+J.camera-(to.height-from.height)*u-105*4*u*(1-u);const mirror=to.landingX>from.landingX;
 // Stable flight reference point, independent of the changing silhouette.
 if(u<.24){const mix=smooth((u-.14)/.10);sprite('jump','takeoff',x,y,mirror,0,1-mix);if(mix>0)sprite('jump','airborne',x,y,mirror,0,mix);}
 else if(u>.85){const mix=smooth((u-.85)/.15);sprite('jump','airborne',x,y,mirror,0,1-mix);sprite('jump','land',x,y,mirror,0,mix);}
 else sprite('jump','airborne',x,y,mirror);
}
function paintCard(){if(J.word<0||J.phase==='restarting')return;const task=M.tasks[J.word],rect=M.card.imageRect,s=.9*Math.min(rect[2]/task.source[2],rect[3]/task.source[3]),w=task.source[2]*s,h=task.source[3]*s;c.save();c.globalAlpha=1;c.drawImage(images['assets/ui/card-frame.png'],...M.card.screenRect);c.drawImage(images[task.file],...task.source,rect[0]+(rect[2]-w)/2,rect[1]+(rect[3]-h)/2,w,h);c.restore();}
function render(){c.clearRect(0,0,1600,900);if(images['assets/scene/sky.png'])c.drawImage(images['assets/scene/sky.png'],0,0,1600,900);if(!loaded)return;
 c.drawImage(images['assets/scene/forest-far.png'],0,80+J.camera*.055,1600,900);
 c.save();c.globalAlpha=Math.max(0,1-J.camera/2600);c.drawImage(nearLayer,0,J.camera*.5,1600,1000);c.restore();
 const tree=M.tree;c.drawImage(images[tree.file],tree.x,900-tree.height-(tree.bottom||0)+J.camera,tree.width,tree.height);
 J.stops.forEach(paintStop);if(J.phase==='flight')paintFlight();
 if(J.camera<650)c.drawImage(images['assets/scene/forest-floor.png'],0,367+J.camera,1600,533);
 paintCard();
}
function syncUI(){const point=conePoint(),active=loaded&&!inMenu&&J.phase==='ready';cone.hidden=!active;cone.disabled=!active;
 if(point){cone.style.left=point.x/16+'%';cone.style.top=point.y/9+'%';}
 finish.hidden=inMenu||J.phase!=='finished';backMenu.hidden=inMenu||J.phase==='finished';
 if(J.word!==lastWord){lastWord=J.word;if(J.word>=0)document.getElementById('announcement').textContent='Назови картинку: '+M.tasks[J.word].word+'.';}
 if(J.phase!==lastPhase){const prior=lastPhase;lastPhase=J.phase;
  if(J.phase==='finished'){document.getElementById('announcement').textContent='Мы добрались до верхушки!';if(keyboardInteraction)again.focus({preventScroll:true});}
  if(J.phase==='ready'&&keyboardInteraction&&prior!=='')cone.focus({preventScroll:true});
 }
}
cone.addEventListener('click',event=>{keyboardInteraction=event.detail===0;if(!inMenu&&J.click())syncUI();});
again.addEventListener('click',event=>{keyboardInteraction=event.detail===0;if(J.restart())syncUI();});
document.addEventListener('visibilitychange',()=>{last=0;});
function tick(now){const dt=last?Math.min(80,now-last):0;last=now;if(!document.hidden&&loaded&&!inMenu)J.step(dt);render();syncUI();requestAnimationFrame(tick);}
function loadImage(path){return new Promise((resolve,reject)=>{const im=new Image();const timeout=setTimeout(()=>reject(new Error(path)),45000);im.onload=()=>{clearTimeout(timeout);resolve(im);};im.onerror=()=>{clearTimeout(timeout);reject(new Error(path));};im.src=new URL(path,BASE).href;});}
async function load(){const attempt=++loadAttempt;errorBox.hidden=true;menu.hidden=!inMenu;loaded=false;cone.hidden=true;roundButtons.forEach(b=>b.disabled=true);document.getElementById('menu-status').hidden=false;try{
 const entries=await Promise.all(Object.keys(M.assets).filter(p=>p!=='assets/squirrel/idle.png').map(async path=>[path,await loadImage(path)]));
 if(attempt!==loadAttempt)return;for(const [path,im]of entries)images[path]=im;
 // Feather the cropped tops of the near forest while the layer moves down.
 const near=images['assets/scene/forest-near.png'];nearLayer=document.createElement('canvas');nearLayer.width=near.width;nearLayer.height=near.height;const n=nearLayer.getContext('2d');n.drawImage(near,0,0);n.globalCompositeOperation='destination-in';const fade=n.createLinearGradient(0,0,0,near.height*.18);fade.addColorStop(0,'rgba(0,0,0,0)');fade.addColorStop(1,'rgba(0,0,0,1)');n.fillStyle=fade;n.fillRect(0,0,near.width,near.height);
 loaded=true;J.reset();last=0;roundButtons.forEach(b=>b.disabled=false);document.getElementById('menu-status').hidden=true;syncUI();
 }catch(e){if(attempt!==loadAttempt)return;document.getElementById('error-detail').textContent='Не загружен файл: '+e.message;menu.hidden=true;errorBox.hidden=false;}}
document.getElementById('retry').addEventListener('click',load);
load();requestAnimationFrame(tick);

</script>
